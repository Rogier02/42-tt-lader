<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>42 Table Tennis Ladder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23e8742c%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800;9..144,900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%}
[hidden]{display:none!important}
/* Layout: a floating navy pill for navigation over a cream (light) or navy (dark) page; one working column.
   Chunky serif headlines, grotesk body, pill-shaped controls. Lime marks things you create; orange (the ball) marks what's live. */
:root{
  --bg:#ede6c4; --surface:#f6f1db; --sunk:#e5ddb7; --ink:#0a2952; --muted:#4f6080; --line:#cfc59c;
  --band:#0a2952; --on-band:#ede6c4; --band-line:rgba(237,230,196,.2);
  --lime:#aaf136; --on-lime:#0a2952; --ball:#e8742c;
  --table:#0a2952; --table-ink:#0a2952; --on-table:#ede6c4;
  --win:#2d7438; --loss:#b23d2c; --warn:#86600c;
  --win-bg:#d9e6bf; --loss-bg:#f0d3c2; --warn-bg:#efdca6; --focus:#0a2952;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-panel:26px; --r-item:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a2952; --surface:#0f3466; --sunk:#08234a; --ink:#ede6c4; --muted:#a8b2c0; --line:#24497b;
  --band:#143c70; --on-band:#ede6c4; --band-line:rgba(237,230,196,.18);
  --table:#3f74b8; --table-ink:#ede6c4; --on-table:#ede6c4;
  --win:#9bd66d; --loss:#f29a83; --warn:#e9c467;
  --win-bg:#1d4a40; --loss-bg:#4e2c38; --warn-bg:#4a4128; --focus:#aaf136; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0a2952; --surface:#0f3466; --sunk:#08234a; --ink:#ede6c4; --muted:#a8b2c0; --line:#24497b;
  --band:#143c70; --on-band:#ede6c4; --band-line:rgba(237,230,196,.18);
  --table:#3f74b8; --table-ink:#ede6c4; --on-table:#ede6c4;
  --win:#9bd66d; --loss:#f29a83; --warn:#e9c467;
  --win-bg:#1d4a40; --loss-bg:#4e2c38; --warn-bg:#4a4128; --focus:#aaf136; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- navigation: floating pill ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-inline:16px;padding-block:14px 6px;background:linear-gradient(var(--bg) 70%,transparent)}
.top-in{max-width:1080px;margin:0 auto;background:var(--band);color:var(--on-band);border:1px solid var(--band-line);border-radius:999px;padding:8px 8px 8px 22px;
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand tabs actions";align-items:center;gap:12px}
.brand-row{display:contents}
.brand{grid-area:brand;font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;margin:0;white-space:nowrap}
.ball{width:13px;height:13px;border-radius:50%;background:var(--ball);display:inline-block;flex:none;box-shadow:inset -3px -3px 0 rgba(0,0,0,.16)}
.top-actions{grid-area:actions;display:flex;align-items:center;gap:12px}
.tabs{grid-area:tabs;display:flex;gap:2px;justify-content:center;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;color:var(--on-band);opacity:.78;padding:8px 14px;font-size:.95rem;font-weight:500;cursor:pointer;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center}
.tab:hover{opacity:1}
.tab[aria-current="page"]{opacity:1;background:rgba(237,230,196,.14)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--lime);color:var(--on-lime);font-size:.72rem;font-weight:700;margin-left:6px}
.who{display:flex;align-items:center;gap:8px;font-size:.88rem;white-space:nowrap}
.who b{font-weight:600}
.who .link-btn{opacity:.75}
.new-match{background:var(--lime);color:var(--on-lime);border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:.95rem;white-space:nowrap}
.new-match:hover{filter:brightness(1.05)}
.new-match .plus{font-size:1.15rem;line-height:1}
@media (max-width:900px){
  .top-in{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand actions" "tabs tabs";border-radius:26px;padding:10px 10px 8px 18px;row-gap:6px}
  .tabs{justify-content:flex-start;margin-left:-8px}
}
@media (max-width:600px){
  .top{padding-inline:10px}
  .brand{font-size:0;gap:0}            /* only the ball on phones; the page title is in the tab */
  .who b{display:none}
  .top-actions{gap:8px;justify-content:flex-end;min-width:0}
  .new-match{padding:9px 14px}
}

.link-btn{background:none;border:0;padding:4px 2px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;cursor:pointer;color:inherit;opacity:.85}
.link-btn:hover{opacity:1}
.demo-note{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:6px;font-size:.82rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
main{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:12px 72px;display:flex;flex-direction:column;gap:18px}

/* ---------- type ---------- */
h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,4vw,2.2rem);letter-spacing:-.025em;line-height:1.05;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:-.015em;line-height:1.15;margin:0}
.lede{color:var(--muted);margin:0;max-width:62ch}
.eyebrow,.lbl,label,.stat .k,th{font-size:.82rem;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none}
.note{font-size:.85rem;color:var(--muted);margin:0}
.empty{color:var(--muted);padding:8px 0;margin:0}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border-radius:var(--r-panel);padding:26px;display:flex;flex-direction:column;gap:18px;min-width:0}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
@media (max-width:520px){.panel{padding:18px;border-radius:20px}}

.stats{display:flex;flex-wrap:wrap;gap:10px 34px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:1.55rem;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums lining-nums}
.stat .v small{font-family:var(--f-body);font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:0}

/* ---------- controls ---------- */
.btn{border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:600;border:1px solid color-mix(in srgb,var(--ink) 30%,transparent);background:transparent;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-primary:hover{background:var(--ink);filter:brightness(1.12)}
.btn-new{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.btn-new:hover{background:var(--lime);filter:brightness(1.05)}
.btn-new:disabled{filter:none}
.btn-good{background:var(--win);border-color:var(--win);color:var(--bg)}
.btn-good:hover{background:var(--win);filter:brightness(1.08)}
.btn-danger{background:var(--loss);border-color:var(--loss);color:var(--bg)}
.btn-danger:hover{background:var(--loss)}
.btn-sm{padding:7px 14px;font-size:.88rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.seg button{background:transparent;border:0;padding:6px 14px;cursor:pointer;font-size:.9rem;font-weight:500;border-radius:999px;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.field{display:flex;flex-direction:column;gap:6px;max-width:360px}
select,input[type=text],input[type=date],textarea,input[type=datetime-local],input[type=number].plain{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:.95rem;color:var(--ink);font-weight:400}

.chip{display:inline-flex;align-items:center;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:2px;font-family:var(--f-body);line-height:1.5;white-space:nowrap}
.chip.win{background:var(--win-bg);color:var(--win);border-color:transparent}
.chip.loss{background:var(--loss-bg);color:var(--loss);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.ch{background:var(--lime);color:var(--on-lime);border-color:transparent}
.up{color:var(--win)} .down{color:var(--loss)}
.status{min-height:1.5em;font-size:.95rem}
.status.err{color:var(--loss)} .status.ok{color:var(--win)}
.pred{background:var(--sunk);border-radius:var(--r-item);padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 24px;font-size:.92rem;max-width:560px}
.pred b{font-weight:700;font-variant-numeric:tabular-nums}
.notice{background:var(--warn-bg);color:var(--ink);border-radius:var(--r-item);padding:12px 16px;font-size:.92rem;max-width:600px}
.notice b{color:var(--warn)}
details>summary{cursor:pointer;font-weight:600;color:var(--ink)}

/* ---------- lists and tables ---------- */
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item .main{min-width:0;display:flex;flex-direction:column;gap:2px}
.item .sub{font-size:.86rem;color:var(--muted)}
.score{font-variant-numeric:tabular-nums;font-size:.9rem;white-space:nowrap}

.tbl-wrap{overflow-x:auto;margin-inline:-26px;padding-inline:26px}
table{border-collapse:collapse;width:100%;min-width:560px}
th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ink)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tr.me td{background:var(--sunk)}
tr.me td:first-child{border-radius:12px 0 0 12px}
tr.me td:last-child{border-radius:0 12px 12px 0}
.rank{font-family:var(--f-display);font-weight:800;font-size:1.3rem;width:46px;color:var(--muted);font-variant-numeric:tabular-nums lining-nums}
tr:nth-child(-n+3) .rank{color:var(--ink)}
.pname{background:none;border:0;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;color:var(--ink)}
.pname b{font-weight:600}
.pname span{font-size:.8rem;color:var(--muted)}
.pname:hover b{text-decoration:underline;text-underline-offset:3px}
.form{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.w{background:var(--win)} .dot.l{background:var(--loss)}
th .sort{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
th .sort:hover,th .sort.on{color:var(--ink)}
th .sort.on{font-weight:700}
th .sort .arrow{font-size:.68rem;opacity:.45}
th .sort.on .arrow{opacity:1}
@media (max-width:520px){.tbl-wrap{margin-inline:-18px;padding-inline:18px}}

/* ---------- sets ---------- */
.sets{display:flex;flex-direction:column;gap:8px;max-width:360px}
.set-row,.set-head{display:grid;grid-template-columns:64px 1fr 1fr;gap:8px;align-items:center;max-width:360px}
.set-row .sn{font-size:.85rem;color:var(--muted)}
.set-row input{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px;width:100%;text-align:center;font-family:var(--f-display);font-weight:700;font-size:1.2rem;color:var(--ink)}
.set-row input.bad{border-color:var(--loss)}
.set-row input:disabled{opacity:.35}
.set-head{font-size:.82rem;color:var(--muted);text-align:center}
.set-head span:first-child{text-align:left}

/* ---------- profile ---------- */
.hero{display:flex;gap:16px 32px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.hero-id{display:flex;flex-direction:column;gap:8px;min-width:0}
.hero-id h2{font-size:clamp(2.2rem,6vw,3.4rem);font-weight:900;letter-spacing:-.035em;line-height:.95}
.id-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.92rem}
.rating-block{display:flex;flex-direction:column;align-items:flex-end}
.rating-big{font-family:var(--f-display);font-weight:900;font-size:clamp(4.2rem,15vw,7.5rem);line-height:.82;letter-spacing:-.05em;font-variant-numeric:tabular-nums lining-nums}
.rating-big small{font-family:var(--f-body);font-size:1rem;color:var(--muted);font-weight:500;margin-left:8px;letter-spacing:0;vertical-align:top}
@media (max-width:520px){.rating-block{align-items:flex-start}}
.nudges{display:flex;gap:8px;flex-wrap:wrap}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-inline:-26px;padding-inline:26px}
.ptabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:1rem;display:inline-flex;align-items:center;gap:8px}
.ptabs button:hover{color:var(--ink)}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.ptabs .count{font-size:.74rem;background:var(--sunk);border-radius:999px;padding:0 8px;color:var(--muted);font-variant-numeric:tabular-nums}
#ptab-body{display:flex;flex-direction:column;gap:18px}
@media (max-width:520px){.ptabs{margin-inline:-18px;padding-inline:18px}}
.chart-wrap{overflow-x:auto}
.chart{width:100%;min-width:420px;height:auto;display:block}
.chart polyline{stroke:var(--table-ink)}
.chart polygon{fill:var(--table-ink)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .main{display:flex;flex-direction:column;gap:3px;min-width:0}
.mrow .sub{font-size:.86rem;color:var(--muted)}
.mrow .right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.mrow .right>.score:first-child{font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.mrow .pts{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow.open{background:var(--sunk);margin-inline:-14px;padding-inline:14px;border-radius:var(--r-item);border-bottom:0;margin-bottom:6px}

/* ---------- coalitions ---------- */
.coal{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-body);font-size:.8rem;font-weight:600;padding:2px 10px 2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.coal i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.coal-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px;flex:none}
.coal-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.coal-card,.season-coal{border-radius:var(--r-item);padding:14px 16px;display:flex;flex-direction:column;gap:4px;background:var(--sunk);border-top:5px solid var(--c)}
.coal-card b{font-family:var(--f-display);font-size:1.3rem}
.coal-card span{font-size:.84rem;color:var(--muted)}
.race{display:flex;flex-direction:column;gap:22px}
.race-row{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start}
.race-row .rank{width:auto;padding-top:2px}
.race-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.race-name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.race-name b{font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em}
.race-pts{margin-left:auto;font-family:var(--f-display);font-weight:700;font-size:1.3rem}
.race-bar{height:12px;border-radius:999px;background:var(--sunk);overflow:hidden}
.race-bar i{display:block;height:100%;background:var(--c);border-radius:999px}
.race-row .sub{font-size:.86rem;color:var(--muted)}
.race-row.mine .race-name b{color:var(--c)}
table.h2h{min-width:420px}
td.muted{color:var(--muted)}
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;max-width:68ch}
.prize{background:var(--band);color:var(--on-band);border-radius:var(--r-item);padding:16px 20px;display:flex;flex-direction:column;gap:2px}
.prize .eyebrow{color:rgba(237,230,196,.75)}
.prize b{font-family:var(--f-display);font-weight:800;font-size:1.45rem;letter-spacing:-.015em}
.admin-box{border-top:1px solid var(--line);padding-top:16px}
.seasons{display:flex;flex-direction:column}
details.season{border-bottom:1px solid var(--line)}
details.season:last-child{border-bottom:0}
details.season>summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:14px 0;color:var(--ink);font-weight:400}
details.season>summary::-webkit-details-marker{display:none}
details.season>summary:hover .season-name b{text-decoration:underline;text-underline-offset:4px}
.season-name{display:flex;flex-direction:column;min-width:0}
.season-name b{font-family:var(--f-display);font-weight:800;font-size:1.4rem;letter-spacing:-.015em}
.season-win{display:flex;gap:10px;align-items:center}
.season-mvp{grid-column:1/-1;font-size:.86rem}
.season-body{display:flex;flex-direction:column;gap:12px;padding:4px 0 18px}
.season-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.season-coal .race-name b{font-size:1.2rem}
.tops{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:2px;font-size:.92rem}
.tops li span{float:right;color:var(--muted)}

/* ---------- a challenger approaches: the one navy block on a cream page ---------- */
.challenger{--ink:var(--on-band);--muted:rgba(237,230,196,.72);--line:var(--band-line);--surface:transparent;--sunk:rgba(237,230,196,.08);
  background:var(--band);color:var(--ink);border-radius:var(--r-panel);padding:24px 26px;display:flex;flex-direction:column;gap:12px}
.challenger.quiet{background:transparent;--ink:inherit;--muted:var(--muted);border:1px dashed currentColor;opacity:.75;color:inherit}
.ch-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ch-title{font-family:var(--f-display);font-weight:900;font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:-.035em;line-height:1}
.ch-mult{font-family:var(--f-display);font-weight:900;font-size:clamp(1.8rem,5vw,2.6rem);color:var(--lime);letter-spacing:-.03em;line-height:1}
.challenger>.sub{max-width:62ch;color:var(--muted)}
.ch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0 4px;border-top:1px solid var(--line)}
.ch-row>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.ch-row .sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:.9rem}
.ch-name{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:-.015em}
.ch-name .link-btn{font:inherit}
.ch-row.done{opacity:.75}
.ch-board{display:flex;flex-direction:column}
.ch-pair{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.ch-pair:last-child{border-bottom:0}
.ch-pair .vs{color:var(--muted);font-size:.82rem}
.ch-pair .w{font-weight:700}
.ch-pair .chip:last-child{margin-left:auto}

/* ---------- tournaments ---------- */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.two>.panel{padding:20px 22px;border-radius:20px}
.trow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
.trow:last-child{border-bottom:0}
.trow:hover .tname{text-decoration:underline;text-underline-offset:3px}
.tname{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .sub{font-size:.86rem;color:var(--muted)}
.datebox{display:flex;flex-direction:column;align-items:center;border-radius:14px;padding:6px 0;background:var(--band);color:var(--on-band)}
.datebox b{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1}
.datebox span{font-size:.72rem;opacity:.8}
.chip.st-live{background:var(--ball);color:#2a1205;border-color:transparent}
.chip.st-open{color:var(--ink);border-color:var(--ink)}
.chip.st-proposed{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.st-done{color:var(--muted)}
.chip.st-rejected,.chip.st-cancelled{background:var(--loss-bg);color:var(--loss);border-color:transparent}
.cal-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.cal-head h3{min-width:0;text-align:center}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:340px}
.cal .dow{font-size:.8rem;color:var(--muted);padding:8px;background:var(--sunk);border-bottom:1px solid var(--line);font-weight:500}
.cal .day{min-height:96px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:var(--sunk)}
.cal .day.out .dn{color:var(--muted);opacity:.6}
.cal .dn{font-size:.8rem;font-variant-numeric:tabular-nums;align-self:flex-start;padding:0 6px;border-radius:999px}
.cal .day.today .dn{background:var(--ink);color:var(--bg)}
.ev{font:inherit;font-size:.72rem;text-align:left;border:0;border-radius:999px;padding:2px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--table);color:var(--on-table);width:100%;font-weight:500}
.ev.done{background:var(--line);color:var(--ink)}
.ev.proposed{background:var(--warn-bg);color:var(--warn)}
.ev.live{background:var(--ball);color:#2a1205}
@media (max-width:520px){.cal .day{min-height:66px;padding:3px 2px}.ev{font-size:.62rem;padding:1px 4px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted);font-size:.92rem}
.meta b{color:var(--ink);font-weight:600}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.86rem;background:var(--sunk);cursor:pointer;color:var(--ink)}
.person.inv{border-style:dashed;background:transparent;color:var(--muted)}
.tpl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;max-width:720px}
.tpl button{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-item);padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.tpl button b{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.tpl button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tpl button span{font-size:.82rem;color:var(--muted)}
.stage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;max-width:720px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;max-width:720px}
.form-grid .field,.stage-grid .field{max-width:none}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.checks label{font-size:.95rem;color:var(--ink);font-weight:400;display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer}
.checks label span{margin-left:auto;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rounds-fmt{display:flex;flex-wrap:wrap;gap:8px}
.rounds-fmt .rf{border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 14px;display:flex;gap:8px;align-items:center;font-size:.9rem;background:var(--sunk);color:var(--ink)}
.rounds-fmt select{width:auto;padding:4px 8px;border-radius:999px}
.bracket{display:flex;gap:28px;overflow-x:auto;padding-bottom:8px}
.round{display:flex;flex-direction:column;justify-content:space-around;gap:16px;min-width:220px}
.round h3{font-size:1.05rem}
.round h3 .bo{font-family:var(--f-body);font-weight:500;font-size:.8rem;margin-left:8px;color:var(--muted)}
.bm{border-radius:var(--r-item);background:var(--sunk);overflow:hidden}
.bm .slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;font-size:.92rem}
.bm .slot+.slot{border-top:1px solid var(--line)}
.bm .slot.won{font-weight:700}
.bm .slot.lost{color:var(--muted)}
.bm .sd{font-size:.75rem;color:var(--muted);width:20px;display:inline-block;font-variant-numeric:tabular-nums}
.bm .foot{padding:7px 12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);background:var(--surface)}
.back{align-self:flex-start}

/* ---------- activity ---------- */
.act-bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;align-items:end;max-width:560px}
.act-bar{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.act-bar .b{height:84px;width:100%;max-width:44px;background:var(--sunk);border-radius:999px;display:flex;align-items:flex-end;overflow:hidden}
.act-bar .b i{display:block;width:100%;background:var(--ink);min-height:3px;border-radius:999px}
.act-bar:hover .b i{background:var(--lime)}
.act-bar .n{font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums}
.act-bar .d{font-size:.76rem;color:var(--muted)}
.act-day{display:flex;flex-direction:column;gap:4px}
.act-day h3 .sub{font-family:var(--f-body);font-weight:500;font-size:.86rem;letter-spacing:0;margin-left:8px;color:var(--muted)}
.act-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.act-row:last-child{border-bottom:0}
.act-time{color:var(--muted);font-size:.85rem;padding-top:3px}
.act-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.act-p{opacity:1;text-decoration:none;color:var(--ink)}
.act-p.w{font-weight:700}
.act-p:hover{text-decoration:underline}
.act-score{margin-inline:6px;font-family:var(--f-display);font-weight:700;font-size:1.05rem}

/* ---------- sign in: a full navy page ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding-inline:20px;padding-block:48px;background:var(--band);color:var(--on-band);
  --ink:var(--on-band);--muted:rgba(237,230,196,.72);--line:var(--band-line);--sunk:rgba(237,230,196,.06)}
.login-card{max-width:520px;width:100%;display:flex;flex-direction:column;gap:28px}
.login-top{display:flex;flex-direction:column;gap:14px}
.login-top h1{font-family:var(--f-display);font-weight:900;font-size:clamp(3rem,11vw,4.8rem);letter-spacing:-.045em;line-height:.92;margin:0;text-wrap:balance}
.login-top p{margin:0;color:var(--muted);font-size:1.1rem;max-width:36ch}
.login-body{display:flex;flex-direction:column;gap:14px}
.btn-42{background:var(--lime);color:var(--on-lime);border:0;border-radius:999px;padding:16px 24px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;align-self:flex-start}
.btn-42 .mark{font-family:var(--f-display);font-weight:900;font-size:1.1rem;border:2px solid currentColor;padding:0 5px;border-radius:6px;line-height:1.2}
.pick{display:flex;flex-direction:column;max-height:340px;overflow-y:auto;border-top:1px solid var(--line)}
.pick button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 4px;cursor:pointer;text-align:left;color:var(--ink)}
.pick button:hover{background:var(--sunk)}
.pick button span{font-size:.86rem;color:var(--muted)}
.pick .chip{color:var(--lime);border-color:var(--lime)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,22,46,.6);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:var(--r-panel);padding:24px;width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow-y:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--band);color:var(--on-band);padding:12px 20px;border-radius:999px;font-size:.95rem;z-index:30;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(6,22,46,.25)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{transform:translate(-50%,8px);opacity:0}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="/app.js"></script>
</body>
</html>
